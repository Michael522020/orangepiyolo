# Ascend ATC 静态 AIPP：给 USB 摄像头 + OpenCV 使用。
# OpenCV 读到的是 BGR uint8。rbuv_swap_switch 打开后，NPU 把 B 和 R 对调，
# 再按 YOLOv8 的方式做 (pixel - 0) * (1/255)。CPU 不再做 cvtColor、transpose 和除法。
#
# 推理输入：NHWC uint8，形状 [1, 640, 640, 3]，数值 0~255。
# 禁止 /255，禁止转 float32，禁止再排成 NCHW。
# 对应 gesture_infer.py 的 input_mode = "aipp_rgb"。

aipp_op {
    aipp_mode: static
    related_input_rank: 0
    input_format: RGB888_U8
    src_image_size_w: 640
    src_image_size_h: 640
    csc_switch: false
    rbuv_swap_switch: true
    mean_chn_0: 0
    mean_chn_1: 0
    mean_chn_2: 0
    min_chn_0: 0.0
    min_chn_1: 0.0
    min_chn_2: 0.0
    var_reci_chn_0: 0.003921568627451
    var_reci_chn_1: 0.003921568627451
    var_reci_chn_2: 0.003921568627451
}
