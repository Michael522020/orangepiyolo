# Ascend ATC 静态 AIPP：YUV420SP(NV12) -> RGB + 除以 255
# 配套 OM 的推理输入是 uint8，禁止再喂 float32。
#
# 色彩范围：下面这组矩阵是 BT.601 全范围（Y: 0~255）。
# 它与 OpenCV COLOR_BGR2YUV_I420 再打包成的 NV12 一致。
# 若摄像头 ISP 直接输出电视范围 NV12（Y: 16~235），把矩阵和 bias 换成文件末尾注释里的 limited-range 版本。
# UV 顺序：NV12 保持 rbuv_swap_switch: false；NV21 改成 true。
#
# USB + cv2.VideoCapture 实际拿到的是 BGR，不是 NV12。
# 这种摄像头请改用 aipp_rgb.cfg。先在 CPU 上把 BGR 转成 NV12 再走本配置，
# 颜色转换又回到了 CPU，端到端通常不会更快。

aipp_op {
    aipp_mode: static
    related_input_rank: 0
    input_format: YUV420SP_U8
    src_image_size_w: 640
    src_image_size_h: 640
    csc_switch: true
    rbuv_swap_switch: false
    matrix_r0c0: 256
    matrix_r0c1: 0
    matrix_r0c2: 359
    matrix_r1c0: 256
    matrix_r1c1: -88
    matrix_r1c2: -183
    matrix_r2c0: 256
    matrix_r2c1: 454
    matrix_r2c2: 0
    input_bias_0: 0
    input_bias_1: 128
    input_bias_2: 128
    mean_chn_0: 0
    mean_chn_1: 0
    mean_chn_2: 0
    min_chn_0: 0.0
    min_chn_1: 0.0
    min_chn_2: 0.0
    var_reci_chn_0: 0.003921568627451
    var_reci_chn_1: 0.003921568627451
    var_reci_chn_2: 0.003921568627451
}

# limited-range BT.601（Y 从 16 开始）替换上面的 matrix 和 input_bias：
# matrix_r0c0: 298
# matrix_r0c1: 0
# matrix_r0c2: 409
# matrix_r1c0: 298
# matrix_r1c1: -100
# matrix_r1c2: -208
# matrix_r2c0: 298
# matrix_r2c1: 516
# matrix_r2c2: 0
# input_bias_0: 16
# input_bias_1: 128
# input_bias_2: 128
